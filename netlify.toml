# -----------------------------------------------------------------------------
# DONE Events & Entertainment — Netlify production configuration.
#
# The site is a single-page Vite build served from the domain root. Vite's base
# defaults to '/' (see vite.config.js), so no DEPLOY_BASE is set here.
# -----------------------------------------------------------------------------

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# One route, so every path resolves to the app shell. 200 rather than 301 keeps
# the URL intact, which matters for chapter anchors like /#ch05 and for a hard
# refresh on a deep link. Netlify's form handler is exempted above it, or the
# POST would be rewritten into the shell before it reached the form endpoint.
[[redirects]]
  from = "/.netlify/*"
  to = "/.netlify/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed filenames are content-addressed, so they can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Media keeps its own name across deploys, so it gets a shorter, revalidating
# cache rather than an immutable one.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
