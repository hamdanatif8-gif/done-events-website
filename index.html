<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#070809" />
    <meta name="color-scheme" content="dark" />

    <title>NOVA_AI — Clear. Precise. Automated.</title>
    <meta
      name="description"
      content="NovaAI designs intelligent systems that bring clarity, precision and efficiency to the way companies operate. AI automation, AI integration and AI-agent development."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="NOVA_AI — Clear. Precise. Automated." />
    <meta
      property="og:description"
      content="AI automation, AI integration and AI-agent development for modern companies."
    />
    <meta property="og:image" content="./media/nova-hero-poster.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
    />

    <link rel="preload" as="image" href="./media/nova-hero-poster.jpg" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; font-family: system-ui, sans-serif; color: #fff">
        <h1>NOVA_AI — Clear. Precise. Automated.</h1>
        <p>
          NovaAI designs intelligent systems that bring clarity, precision and efficiency to the way
          companies operate. We build AI automation, AI integration and AI agents. Enable JavaScript
          for the full experience, or email
          <a style="color: #e7a15f" href="mailto:hello@novaai.systems">hello@novaai.systems</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Static mirror of the consultation form so Netlify's build-time bot can
      register the form fields even though the live form is React-rendered.
    -->
    <form name="consultation" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="consultation" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <textarea name="automate"></textarea>
    </form>
  </body>
</html>
