<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2318f0" />
    <title>DONE Events &amp; Entertainment | Dubai — Day to Night. Done Right.</title>
    <meta
      name="description"
      content="DONE Events &amp; Entertainment is a Dubai events company: event planning, creative direction, production, entertainment and hospitality for corporate, private, wedding, live and outdoor events across the UAE."
    />
    <meta name="author" content="DONE Events &amp; Entertainment" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DONE Events &amp; Entertainment" />
    <meta property="og:locale" content="en_AE" />
    <meta property="og:title" content="DONE Events &amp; Entertainment | Dubai" />
    <meta
      property="og:description"
      content="Event planning, creative direction, production, entertainment and hospitality under one line of responsibility. Dubai, United Arab Emirates."
    />
    <meta property="og:image" content="%BASE_URL%media/img/corporate-1200.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%media/img/corporate-1200.webp"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify detects forms by parsing the deployed HTML at build time, and a
      React form only exists after hydration. This static copy is what the
      build crawler registers: the field names must match what the app posts.
      It is hidden from the page and from assistive technology; the real,
      designed form is in MailChapter.jsx and posts to this form name.
    -->
    <form name="event-brief" data-netlify="true" netlify-honeypot="company-website" hidden>
      <input type="hidden" name="form-name" value="event-brief" />
      <input type="text" name="company-website" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="eventType" />
      <input type="date" name="date" />
      <input type="text" name="emirate" />
      <input type="text" name="venue" />
      <input type="text" name="guests" />
      <input type="text" name="setting" />
      <input type="text" name="services" />
      <input type="text" name="entertainment" />
      <input type="text" name="catering" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
